<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-0">
        <!-- Header -->
        <header class="notifier-header">
            <h1 class="mb-0">Notifier</h1>
            <div class="header-icons">
                <div class="notification-bell position-relative">
                    <i class="bi bi-bell-fill"></i>
                    <span class="badge">1</span>
                </div>
                <button class="btn menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </header>

        <!-- Control Bar -->
        <div class="control-bar">
            <button class="btn btn-link refresh-btn" onclick="refreshNotifications()">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="btn btn-outline-dark clear-all-btn" onclick="clearAllNotifications()">
                Clear all
            </button>
        </div>

        <!-- Notifications Container -->
        <div class="notifications-container" id="notificationsContainer">
            <!-- Notification cards will be generated by JavaScript -->
        </div>
    </div>

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-unstyled">
                <li><a href="#" class="text-decoration-none">Settings</a></li>
                <li><a href="#" class="text-decoration-none">Preferences</a></li>
                <li><a href="#" class="text-decoration-none">Help</a></li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
